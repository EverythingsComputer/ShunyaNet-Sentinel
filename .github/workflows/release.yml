name: Build release bundles

# Runs on every version tag (v3.3.0, v3.3.1, ...) and publishes one zip per
# platform to a GitHub Release. Can also be started by hand from the Actions tab
# to test the build without publishing anything.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: ShunyaNetSentinel
  PYTHON_VERSION: "3.12"
  # Hard wall for booting the built bundle, enforced from outside the process.
  SMOKE_LIMIT: "300"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: macos-arm64
            os: macos-14
          # No Intel macOS job. GitHub retired its Intel macOS runners, so a macos-13
          # entry only queues forever; there is nowhere to build an x86_64 .app. A
          # universal2 build (one .app for both Mac architectures) is feasible - it
          # needs a universal2 CPython plus both slices of the PySide6 wheels lipo'd
          # together - but until that is set up here, Intel Macs install from source.

    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # A bundle that cannot boot must fail fast, not hold a runner for hours.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Version string
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="dev";; esac
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # ---------- interpreter ----------
      # Windows: the runner's own Python is fine.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Linux/macOS: hostedtoolcache CPython produces launchers that die at
      # startup ("Failed to load Python shared library /tmp/_MEI..."), so build
      # with an astral python-build-standalone interpreter (via uv) instead.
      - name: Install standalone CPython (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v uv || curl -fsSL https://astral.sh/uv/install.sh | sh
          uv python install "${PYTHON_VERSION}"
          # No --seed: a uv venv carries no pip, and installing with `uv pip`
          # below is faster and does not depend on ensurepip.
          uv venv --python "${PYTHON_VERSION}" .venv-standalone
          echo "VENV=$PWD/.venv-standalone" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        env:
          DIAG: ${{ runner.temp }}/build-log.txt
        run: |
          # NOTE: GITHUB_ENV only reaches LATER steps, so pick the interpreter in a
          # plain shell variable and use that here; export it for the next steps.
          : > "$DIAG"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY_BIN=python
            { python -m pip install --upgrade pip
              python -m pip install -r requirements.txt pyinstaller pillow; } 2>&1 | tee -a "$DIAG"
            test "${PIPESTATUS[0]}" -eq 0
          else
            export PATH="$HOME/.local/bin:$PATH"
            PY_BIN="$VENV/bin/python"
            { uv pip install --python "$PY_BIN" -r requirements.txt pyinstaller pillow; } 2>&1 | tee -a "$DIAG"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              echo "uv install failed; falling back to pip inside the venv" | tee -a "$DIAG"
              { "$PY_BIN" -m ensurepip --upgrade
                "$PY_BIN" -m pip install -r requirements.txt pyinstaller pillow; } 2>&1 | tee -a "$DIAG"
              test "${PIPESTATUS[0]}" -eq 0
            fi
          fi
          echo "PY=$PY_BIN" >> "$GITHUB_ENV"
          # Fail loudly here, not six minutes later inside PyInstaller.
          { "$PY_BIN" -c "import sys, PySide6, feedparser, requests, PyInstaller; print('interpreter:', sys.version); print('PySide6 ok, PyInstaller', PyInstaller.__version__)"; } 2>&1 | tee -a "$DIAG"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Install Qt runtime libraries (Linux, for the smoke test)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0

      # Does the program itself boot on this OS, with no packaging involved? If this
      # passes and the bundle smoke test later fails, the problem is the bundle.
      - name: Source smoke test (no packaging)
        shell: bash
        env:
          DIAG: ${{ runner.temp }}/build-log.txt
          PLATFORM: ${{ matrix.platform }}
        run: |
          set +e
          export SENTINEL_HOME="$RUNNER_TEMP/sentinel-source-home"
          export SENTINEL_SMOKE_FILE="$RUNNER_TEMP/smoke-source.txt"
          rm -rf "$SENTINEL_HOME"; mkdir -p "$SENTINEL_HOME"
          { echo "=== source smoke: $PLATFORM ==="
            "$PY" ShunyaNet_Sentinel.py --smoke-test > "$RUNNER_TEMP/source-smoke.log" 2>&1 &
            pid=$!
            ( sleep 180; kill -9 "$pid" 2>/dev/null ) &
            watcher=$!
            wait "$pid"; echo "source smoke exit: $?"
            kill "$watcher" 2>/dev/null; wait "$watcher" 2>/dev/null
            cat "$RUNNER_TEMP/source-smoke.log" 2>/dev/null
            if [ -f "$SENTINEL_SMOKE_FILE" ]; then cat "$SENTINEL_SMOKE_FILE"; else echo "NO SOURCE SMOKE FILE"; fi
          } 2>&1 | tee -a "$DIAG"
          grep -q "SMOKE OK" "$SENTINEL_SMOKE_FILE" 2>/dev/null || {
            echo "::error::SOURCE_SMOKE_FAILED on $PLATFORM - the program does not boot from source"
            exit 1; }

      # ---------- build ----------
      - name: Generate icons
        shell: bash
        run: |
          "$PY" packaging/make_icons.py

      - name: Build with PyInstaller
        shell: bash
        env:
          DIAG: ${{ runner.temp }}/build-log.txt
        run: |
          { echo "=== pyinstaller ==="
            "$PY" -m PyInstaller --noconfirm --log-level INFO --distpath dist --workpath build ShunyaNet_Sentinel.spec
          } 2>&1 | tee -a "$DIAG"
          test "${PIPESTATUS[0]}" -eq 0

      # PyInstaller writes the .app next to the one-folder tree on macOS, so later
      # steps ask this where things are instead of guessing the layout twice.
      - name: Locate built bundle
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # GITHUB_ENV only reaches LATER steps, so validate the local values here.
          if [ -d "dist/$APP_NAME.app/Contents/MacOS" ]; then
            bundle="dist/$APP_NAME.app"
            binpath="$bundle/Contents/MacOS/$APP_NAME"
          else
            bundle=""
            if [ "$RUNNER_OS" = "Windows" ]; then
              binpath="dist/$APP_NAME/$APP_NAME.exe"
            else
              binpath="dist/$APP_NAME/$APP_NAME"
            fi
          fi
          { echo "APP_BUNDLE=$bundle"
            echo "BUNDLE_BIN=$binpath"
            echo "ASSET=$APP_NAME-v${VERSION}-${PLATFORM}.zip"; } >> "$GITHUB_ENV"
          echo "app bundle: ${bundle:-none}  binary: $binpath"
          test -f "$binpath" || { echo "::error::built binary missing at $binpath"; ls -laR dist | head -40; exit 1; }

      # ---------- macOS: seal the .app (ad-hoc, no certificate needed) ----------
      # Without a signature seal Apple silicon reports "app is damaged". Ad-hoc
      # signing needs no account; users still approve it once in Gatekeeper.
      - name: Code seal the .app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          DIAG: ${{ runner.temp }}/build-log.txt
        run: |
          { echo "=== codesign ($APP_BUNDLE) ==="
            APP="$APP_BUNDLE"
            xattr -cr "$APP"
            codesign --force --deep --sign - "$APP" 2>&1
            codesign -dv --verbose=4 "$APP" 2>&1
            if [ ! -d "$APP/Contents/_CodeSignature" ]; then
              echo "SEAL_MISSING: no Contents/_CodeSignature"
              exit 1
            fi
            if ! codesign --verify --deep --strict "$APP" 2>&1; then
              echo "SEAL_VERIFY_FAILED"
              exit 1
            fi
            echo "ad-hoc seal verified"
          } 2>&1 | tee -a "$DIAG"
          test "${PIPESTATUS[0]}" -eq 0

      # ---------- release gate: run the real bundle ----------
      # The time limit is enforced from OUTSIDE the process: a Qt call blocked in
      # native code keeps the GIL, so an in-process watchdog thread cannot fire.
      - name: Smoke test the built bundle
        shell: bash
        env:
          DIAG: ${{ runner.temp }}/build-log.txt
          PLATFORM: ${{ matrix.platform }}
        run: |
          set +e
          BIN="$PWD/$BUNDLE_BIN"
          export SENTINEL_HOME="$RUNNER_TEMP/sentinel-smoke-home"
          export SENTINEL_SMOKE_FILE="$RUNNER_TEMP/smoke.txt"
          rm -rf "$SENTINEL_HOME"; mkdir -p "$SENTINEL_HOME"
          RCF="$RUNNER_TEMP/smoke-rc"
          echo 1 > "$RCF"
          { echo "=== smoke: $BIN (limit ${SMOKE_LIMIT}s) ==="
            if [ ! -f "$BIN" ]; then
              echo "MISSING BUNDLE BINARY: $BIN"
              rc=127
            elif [ "$RUNNER_OS" = "Windows" ]; then
              # What is actually in the bundle, before we try to run it: a missing
              # Qt platform plugin or core DLL means the loader will fail.
              echo "--- bundle contents ---"
              ls -la "$(dirname "$BIN")" | head -10
              # Where the Qt platform plugins landed (the path differs per OS, so
              # search rather than assume) and whether the core runtime is there.
              echo "  platform plugins:"
              find "dist/$APP_NAME/_internal" -path "*platforms*" \( -name "*.dll" -o -name "*.dylib" \) 2>/dev/null | sed 's|.*_internal/||' | head -8 | sed 's/^/    /'
              for f in Qt6Core.dll Qt5Core.dll python3.dll python312.dll; do
                hit=$(find "dist/$APP_NAME/_internal" -maxdepth 2 -name "$f" 2>/dev/null | head -1)
                if [ -n "$hit" ]; then echo "    present: $f"; else echo "    not found: $f"; fi
              done
              powershell -NoProfile -ExecutionPolicy Bypass -File packaging/smoke_windows.ps1 \
                -Exe "$(cygpath -w "$BIN")" -SmokeLimitSec "$SMOKE_LIMIT" \
                -LogDir "$(cygpath -w "$RUNNER_TEMP")" \
                -SentinelHome "$(cygpath -w "$SENTINEL_HOME")" \
                -SentinelSmokeFile "$(cygpath -w "$SENTINEL_SMOKE_FILE")"
              rc=$?
            else
              "$BIN" --smoke-test >/dev/null 2>&1 &
              pid=$!
              ( sleep "${SMOKE_LIMIT}"; kill -9 "$pid" 2>/dev/null ) &
              watcher=$!
              wait "$pid"; rc=$?
              kill "$watcher" 2>/dev/null
              wait "$watcher" 2>/dev/null
            fi
            echo "--- smoke exit: $rc ---"
            if [ -f "$SENTINEL_SMOKE_FILE" ]; then cat "$SENTINEL_SMOKE_FILE"; else echo "NO SMOKE FILE WRITTEN"; fi
            echo "$rc" > "$RCF"
          } 2>&1 | tee -a "$DIAG"
          # a variable set inside the pipeline above does not survive it, so the
          # exit status is handed over through a file
          rc=$(cat "$RCF" 2>/dev/null || echo 99)
          if [ "$rc" -ne 0 ] || ! grep -q "SMOKE OK" "$SENTINEL_SMOKE_FILE" 2>/dev/null; then
            # the app writes a copy next to itself when it cannot reach the path it
            # was given - show that too rather than losing the diagnosis
            find dist -maxdepth 4 -name "sentinel_smoke.txt" -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \; 2>/dev/null || true
            echo "::error::SMOKE_FAILED on $PLATFORM (exit $rc) - build-log.txt is attached to the release"
            exit 1
          fi
          echo "Bundle boots and reports SMOKE OK on $PLATFORM"

      # ---------- package ----------
      - name: Zip the bundle
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          DIAG: ${{ runner.temp }}/build-log.txt
        run: |
          out="$APP_NAME-v${VERSION}-${PLATFORM}"
          { echo "=== zip ==="
            if [ -n "$APP_BUNDLE" ]; then
              # ditto keeps executable bits and the code seal; --keepParent stores the
              # .app itself rather than its innards at the root of the archive.
              ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "$out.zip"
            elif [ "$RUNNER_OS" = "Windows" ]; then
              # Quote for PowerShell, not bash: pass single-quoted literals so nothing
              # is eaten by the shell on the way through.
              # Windows ships bsdtar, which writes a real .zip (the -a flag infers the
              # format from the extension) and is far quicker over hundreds of Qt files
              # than Compress-Archive. Fall back to PowerShell if it is ever missing.
              if [ -x /c/Windows/System32/tar.exe ]; then
                /c/Windows/System32/tar.exe -a -cf "$out.zip" -C dist "$APP_NAME"
              else
                # Values travel in the environment: quoting does not survive YAML, bash
                # and PowerShell, and $env: needs none of it.
                ZIP_SRC="dist/$APP_NAME" ZIP_DST="$out.zip" \
                  powershell -NoProfile -Command 'Compress-Archive -Path $env:ZIP_SRC -DestinationPath $env:ZIP_DST -Force'
              fi 
            else
              (cd dist && zip -qry "../$out.zip" "$APP_NAME")
            fi
            echo "archive root entries:"
            if [ "$RUNNER_OS" = "Windows" ]; then
              ZIP_DST="$out.zip" powershell -NoProfile -Command 'Add-Type -AssemblyName System.IO.Compression.FileSystem; $z=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:ZIP_DST)); $z.Entries | Select-Object -First 4 -ExpandProperty FullName; $z.Dispose()' 
            else
              unzip -Z1 "$out.zip" | head -4
            fi
            # macOS ships shasum, not sha256sum; Windows git-bash has sha256sum and
            # certutil. All three must produce the same "<hash>  <file>" format so a
            # user can verify with `sha256sum -c` on any platform.
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$out.zip" > "$out.zip.sha256"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$out.zip" > "$out.zip.sha256"
            else
              certutil -hashfile "$out.zip" SHA256 | sed -n '2p' \
                | awk -v f="$out.zip" '{print $1 "  " f}' > "$out.zip.sha256"
            fi
            ls -la "$out.zip" "$out.zip.sha256"
            echo "sha256: $(cut -d' ' -f1 "$out.zip.sha256" 2>/dev/null || true)"
          } 2>&1 | tee -a "$DIAG"
          test "${PIPESTATUS[0]}" -eq 0

      # ---------- publish ----------
      - name: Publish to the Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          DIAG: ${{ runner.temp }}/build-log.txt
          BODY: |
            Portable builds: unzip anywhere and run. Nothing is installed, and nothing leaves your machine except the RSS feeds you load and any notifications you configure.

            These builds are not code-signed with a purchased certificate yet. macOS shows a one-time "unverified developer" prompt (right-click the app, then Open); Windows may show SmartScreen ("More info" then "Run anyway"). Check any download against the .sha256 file published beside it: `sha256sum -c <file>.zip.sha256`.
        run: |
          chmod +x packaging/gh_release.sh
          out="$APP_NAME-v${VERSION}-${PLATFORM}"
          { echo "=== publish ==="
            ./packaging/gh_release.sh upload "$out.zip" \
              && ./packaging/gh_release.sh upload "$out.zip.sha256"
          } 2>&1 | tee -a "$DIAG"
          test "${PIPESTATUS[0]}" -eq 0

      # Windows-only autopsy: rebuild the same program WITH a console and run it.
      # Whatever kills the windowed build at startup (it shows an "Error" dialog and
      # waits forever) writes its traceback to stderr here, where the log can see it.
      - name: Capture the real startup error (Windows failures only)
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          DIAG: ${{ runner.temp }}/build-log.txt
        run: |
          { echo "=== console autopsy ==="
            SENTINEL_CONSOLE=1 "$PY" -m PyInstaller --noconfirm --log-level ERROR \
              --distpath dist-cli --workpath build-cli ShunyaNet_Sentinel.spec
            export SENTINEL_HOME="$RUNNER_TEMP/sentinel-cli-home"
            export SENTINEL_SMOKE_FILE="$RUNNER_TEMP/smoke-cli.txt"
            rm -rf "$SENTINEL_HOME"; mkdir -p "$SENTINEL_HOME"
            exe="./dist-cli/$APP_NAME/$APP_NAME.exe"
            if [ -f "$exe" ]; then
              timeout 120 "$exe" --version; echo "console --version exit=$?"
              timeout 240 "$exe" --smoke-test; echo "console smoke exit=$?"
              if [ -f "$SENTINEL_SMOKE_FILE" ]; then echo "--- console smoke report ---"; cat "$SENTINEL_SMOKE_FILE"; fi
            else
              echo "console build produced no exe at $exe"
            fi
          } 2>&1 | tee -a "$DIAG"

      # A failed job's own log is readable only by repo admins, so publish our copy
      # of the build log - anyone can then see why a tag build broke.
      - name: Publish build diagnostics (failures only)
        if: failure() && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          DIAG: ${{ runner.temp }}/build-log.txt
        run: |
          chmod +x packaging/gh_release.sh
          diag="$DIAG"
          if [ -f "${RUNNER_TEMP}/smoke.txt" ]; then
            { echo; echo "===== smoke ====="; cat "${RUNNER_TEMP}/smoke.txt"; } >> "$diag"
          fi
          { echo; echo "===== dist listing ====="; ls -la dist 2>/dev/null; } >> "$diag" || true
          PY="$PY" ./packaging/gh_release.sh upload "$diag" "build-log-${PLATFORM}.txt" 2>&1 | tail -3
          # if the smoke script screenshotted a dialog, publish that too - it carries
          # the message nobody could see on a headless runner
          for shot in "${RUNNER_TEMP}"/error-screen-*.png; do
            [ -f "$shot" ] || continue
            base=$(basename "$shot" .png)
            PY="$PY" ./packaging/gh_release.sh upload "$shot" "${base}-${PLATFORM}.png" 2>&1 | tail -2
          done

      - name: Upload as workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}
          path: |
            ${{ env.APP_NAME }}-*.zip
            ${{ env.APP_NAME }}-*.zip.sha256
