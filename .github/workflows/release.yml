name: Build release bundles

# Runs on every version tag (v3.3.0, v3.3.1, ...) and publishes one zip per
# platform to a GitHub Release. Can also be started by hand from the Actions tab
# to test the build without publishing anything.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: ShunyaNetSentinel
  PYTHON_VERSION: "3.12"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: macos-arm64
            os: macos-14
          - platform: macos-x86_64
            os: macos-13

    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Version string
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="dev";; esac
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # ---------- interpreter ----------
      # Windows: the runner's own Python is fine.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Linux/macOS: hostedtoolcache CPython produces launchers that die at
      # startup ("Failed to load Python shared library /tmp/_MEI..."), so build
      # with an astral python-build-standalone interpreter (via uv) instead.
      - name: Install standalone CPython (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install "${PYTHON_VERSION}"
          uv venv --python "${PYTHON_VERSION}" .venv-standalone
          echo "VENV=$PWD/.venv-standalone" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt pyinstaller pillow
            echo "PY=python" >> "$GITHUB_ENV"
          else
            "$VENV/bin/python" -m pip install --upgrade pip
            "$VENV/bin/python" -m pip install -r requirements.txt pyinstaller pillow
            echo "PY=$VENV/bin/python" >> "$GITHUB_ENV"
          fi

      - name: Install Qt runtime libraries (Linux, for the smoke test)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0

      # ---------- build ----------
      - name: Generate icons
        shell: bash
        run: |
          "$PY" packaging/make_icons.py

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m PyInstaller --noconfirm --log-level INFO --distpath dist --workpath build ShunyaNet_Sentinel.spec
          else
            "$VENV/bin/pyinstaller" --noconfirm --log-level INFO --distpath dist --workpath build ShunyaNet_Sentinel.spec
          fi

      # ---------- macOS: seal the .app (ad-hoc, no certificate needed) ----------
      # Without a signature seal Apple silicon reports "app is damaged". Ad-hoc
      # signing needs no account; users still approve it once in Gatekeeper.
      - name: Code seal the .app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="dist/$APP_NAME/$APP_NAME.app"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP" 2>codesign.err || true
          if [ -s codesign.err ]; then cat codesign.err; fi
          if [ ! -d "$APP/Contents/_CodeSignature" ]; then
            echo "::error::macOS code seal missing (no Contents/_CodeSignature) - refusing to ship"
            exit 1
          fi
          if ! codesign --verify --deep --strict "$APP"; then
            echo "::error::codesign verification failed - refusing to ship"
            exit 1
          fi
          echo "ad-hoc seal verified"

      # ---------- release gate: run the real bundle ----------
      - name: Smoke test the built bundle
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) BIN="dist/$APP_NAME/$APP_NAME.exe" ;;
            macOS)   BIN="dist/$APP_NAME/$APP_NAME.app/Contents/MacOS/$APP_NAME" ;;
            *)       BIN="dist/$APP_NAME/$APP_NAME" ;;
          esac
          if [ ! -f "$BIN" ]; then
            echo "::error::expected bundle binary not found: $BIN"
            exit 1
          fi
          export SENTINEL_HOME="$RUNNER_TEMP/sentinel-smoke-home"
          export SENTINEL_SMOKE_FILE="$RUNNER_TEMP/smoke.txt"
          rm -rf "$SENTINEL_HOME"; mkdir -p "$SENTINEL_HOME"
          set +e
          "$BIN" --smoke-test > smoke_stdout.log 2>&1
          rc=$?
          set -e
          echo "--- smoke exit: $rc ---"
          cat smoke_stdout.log || true
          if [ -f "$SENTINEL_SMOKE_FILE" ]; then
            echo "--- smoke report ---"
            cat "$SENTINEL_SMOKE_FILE"
          else
            echo "--- no smoke report written ---"
          fi
          if [ "$rc" -ne 0 ] || [ ! -f "$SENTINEL_SMOKE_FILE" ] || ! grep -q "SMOKE OK" "$SENTINEL_SMOKE_FILE"; then
            echo "::error::SMOKE_FAILED on ${{ matrix.platform }} (exit $rc) - see the log above"
            exit 1
          fi
          echo "Bundle boots and reports SMOKE OK on ${{ matrix.platform }}"

      # ---------- package ----------
      - name: Zip the bundle
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          out="$APP_NAME-v${VERSION}-${PLATFORM}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc "dist/$APP_NAME" "$out.zip"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path dist\$env:APP_NAME\* -DestinationPath $out.zip"
          else
            (cd dist && zip -qry "../$out.zip" "$APP_NAME")
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out.zip" > "$out.zip.sha256"
          else
            certutil -hashfile "$out.zip" SHA256 > "$out.zip.sha256"
          fi
          ls -la "$out.zip" "$out.zip.sha256"

      - name: Upload to the Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.zip
            ${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Portable builds: unzip anywhere and run. Nothing is installed, and nothing leaves your machine except the RSS feeds you load and any notifications you configure.

            These builds are not code-signed with a purchased certificate yet. macOS shows a one-time "unverified developer" prompt (right-click the app, then Open); Windows may show SmartScreen ("More info" then "Run anyway"). The README explains why, and how to verify a download against the .sha256 file beside it.

      - name: Upload as workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}
          path: |
            ${{ env.APP_NAME }}-*.zip
            ${{ env.APP_NAME }}-*.zip.sha256
